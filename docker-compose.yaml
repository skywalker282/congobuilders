
services:
  strapi:
    image: ghcr.io/skywalker282/congobuilders-strapi:latest
    build:
      context: ./core
    env_file:
      - ./core/.env
    ports:
      - "6004:1337"
    volumes:
      - strapi-data:/opt/app/.tmp
      - strapi-uploads:/opt/app/public/uploads
    init: true
    restart: unless-stopped

  website:
    image: ghcr.io/skywalker282/congobuilders-website:latest
    build:
      context: ./www
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      STRAPI_API_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      STRAPI_INQUIRY_API_TOKEN: ${STRAPI_INQUIRY_API_TOKEN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "6005:3000"
    depends_on:
      - strapi
    init: true
    restart: unless-stopped

volumes:
  strapi-data:
  strapi-uploads: